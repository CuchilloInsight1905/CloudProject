<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Staj Defteri</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d1b26;--muted:#6b6878;--line:#e3dfd5;--pri:#2f5fd8;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0b0c12;--card:#171822;--ink:#eceaf4;--muted:#a19eb2;--line:#2a2b38;--pri:#6f93ff;--red:#ff6b5b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;width:min(380px,100%);text-align:center}
.ic{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#3a6ff0,#1c46b8);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
h1{font-size:22px;margin:0 0 6px}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
input{width:100%;font:inherit;font-size:18px;letter-spacing:1px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff}
button:disabled{opacity:.6}
#m{min-height:22px;margin-top:12px;font-size:14px;color:var(--red)}
</style>
</head>
<body>
<form class="k" id="f" hidden>
  <div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>Staj Defteri</h1>
  <p>Bu uygulama kişiseldir. Parolanı bu cihazda bir kez girmen yeterli.</p>
  <label for="pw" style="position:absolute;left:-9999px">Parola</label>
  <input id="pw" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" required>
  <button id="b">Aç</button>
  <div id="m" role="status"></div>
</form>
<script>
(function () {
  var w = window.Telegram && Telegram.WebApp; if (w && w.initData) { try { w.ready(); w.expand(); } catch (e) {} }
  var TUZ = "5e05b0195e8c9e32293eb13fcebcf506", TEKRAR = 600000, KASA = "sd-kasa";
  var $ = function (i) { return document.getElementById(i); };
  function db() { return new Promise(function (res, rej) { var r = indexedDB.open(KASA, 1); r.onupgradeneeded = function () { r.result.createObjectStore("k"); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function al() { return db().then(function (d) { return new Promise(function (res) { var q = d.transaction("k").objectStore("k").get("key"); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; }); }); }
  function koy(k) { return db().then(function (d) { return new Promise(function (res, rej) { var t = d.transaction("k", "readwrite"); t.objectStore("k").put(k, "key"); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }); }
  function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function dene(k) {
    return fetch("e/kontrol.bin", { cache: "no-store" }).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
      b = new Uint8Array(b); return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(0, 12) }, k, b.subarray(12));
    }).then(function (x) { return new TextDecoder().decode(x) === "tamam"; }).catch(function () { return false; });
  }
  function ac() {
    if (!("serviceWorker" in navigator)) { $("f").hidden = false; $("m").textContent = "Bu tarayıcı desteklemiyor (Service Worker yok)."; return Promise.resolve(); }
    return navigator.serviceWorker.register("sw.js", { scope: "./" }).then(function () { return navigator.serviceWorker.ready; }).then(function (r) {
      if (r.active) r.active.postMessage("anahtar");
      location.replace("app/" + location.hash);
    });
  }
  al().then(function (k) { if (k) return ac(); $("f").hidden = false; $("pw").focus(); }).catch(function () { $("f").hidden = false; });
  $("f").addEventListener("submit", function (e) {
    e.preventDefault(); var pw = $("pw").value.trim().toLowerCase(); if (!pw) return;
    $("b").disabled = true; $("m").style.color = "var(--muted)"; $("m").textContent = "Kontrol ediliyor…";
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (b) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: hex(TUZ), iterations: TEKRAR, hash: "SHA-256" }, b, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (k) {
      return dene(k).then(function (ok) {
        if (!ok) { $("m").style.color = "var(--red)"; $("m").textContent = "Parola yanlış."; $("b").disabled = false; return; }
        $("m").textContent = "Açılıyor…"; return koy(k).then(ac);
      });
    }).catch(function (er) { $("m").style.color = "var(--red)"; $("m").textContent = "Hata: " + (er && er.message || er); $("b").disabled = false; });
  });
})();
</script>
</body>
</html>
